name: Apercu de la carriere d'athlete

# L'APERCU DE LA BRANCHE claude/athlete-career-mode-cpn75s (24/10, l'auteur :
# une adresse a part, pas /test/). Ce fichier n'existe que sur cette branche :
# une poussee sur elle construit le jeu en canal de test — la meme porte a code
# que /test/ — et le publie en DEPLOIEMENT D'APERCU du projet Cloudflare Pages
# `sprinter-game`, sous la branche `carriere-athlete` :
#
#   https://carriere-athlete.sprinter-game.pages.dev
#
# Un apercu ne touche ni la production de Cloudflare Pages (branche `main`), ni
# GitHub Pages, ni /test/. Le jour ou la branche est fusionnee, ce fichier part
# avec elle — a retirer avant la fusion, ou a garder s'il sert encore.

on:
  push:
    branches: [claude/athlete-career-mode-cpn75s]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apercu-athlete
  cancel-in-progress: true

jobs:
  apercu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Construire en canal de test
        run: npx vite build --outDir dist-apercu
        env:
          BASE_PATH: /
          VITE_CANAL: test

      # Une autre origine que le vrai jeu : l'installer ne remplace rien, mais
      # le nom dit ce que c'est.
      - name: Nommer l'apercu a l'installation
        run: |
          node -e '
            const f = "dist-apercu/manifest.webmanifest";
            const fs = require("fs");
            if (!fs.existsSync(f)) process.exit(0);
            const m = JSON.parse(fs.readFileSync(f, "utf8"));
            m.name = "Sprinter — carrière d’athlète (aperçu)";
            m.short_name = "Sprinter aperçu";
            fs.writeFileSync(f, JSON.stringify(m, null, 2));
          '

      - name: Publier l'apercu sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist-apercu --project-name sprinter-game --branch carriere-athlete --commit-dirty=true
