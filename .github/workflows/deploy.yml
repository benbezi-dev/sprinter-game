name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      # Le jeu, tel que tout le monde le voit. Il est servi a la racine de
      # sprinter-game.com et non plus dans un sous-dossier au nom du depot :
      # le chemin de base se reduit donc a « / ».
      - name: Construire la production
        run: npm run build
        env:
          BASE_PATH: /

      # CE QUE LE CANAL DE TEST GARDE POUR LUI. public/ est copie tel quel dans
      # chaque build : les portraits et la musique des evenements pas encore
      # ouverts seraient servis a la racine du site, lisibles par quiconque
      # devine l'adresse. On les retire de la production ; la version de test,
      # construite a part, les garde sous /test/vedettes/.
      # Les defis de Meba-Mickael Zeze et d'Aurel Manga s'ouvrent tout seuls
      # le samedi 3 octobre 2026 a 21 h 30 (canal.ts, vite.config.ts) : leurs
      # fichiers (meba-*, manga-*, defi-aurel.mp3) doivent donc deja etre en
      # ligne. Aucun evenement n'est retire aujourd'hui ; un prochain qui
      # attendrait sa date se retirerait ici, comme Aurel jusqu'au 03/10.
      #
      # LA NUIT DU MOLOSSE EST CLOSE (01/11) : sa ruelle et sa bete ne vivent plus
      # que dans les versions de test (depot benbezi-dev/sprinter).
      - name: Retirer l'edition close de la production
        run: rm -rf dist/halloween dist/modeles/molosse-chien.glb dist/modeles/boss-plein/molosse.glb

      # LES VERSIONS DE TEST NE SONT PLUS CONSTRUITES ICI (10/11/2026, l'auteur : « deplace
      # la partie test pour alleger le jeu »). Le depot benbezi-dev/sprinter les construit
      # depuis ce depot-ci (main pour /test/, test-ferme/course-3d pour /test3d/) et les
      # publie sur https://benbezi-dev.github.io/sprinter/ — voir son .github/workflows/test.yml.
      # Ici, /test/ et /test3d/ ne sont plus qu'une entree qui renvoie la-bas (chemin,
      # parametres et ancre compris), sur Cloudflare comme sur GitHub Pages.
      - name: Renvoyer /test/ et /test3d/ vers le depot des tests
        run: node tools/preparer-github-pages.mjs dist

      # CLOUDFLARE PAGES (23/10, « heberger le site sur Cloudflare Pages » — pas de plafond
      # de taille, 25 Mo par fichier, 20 000 fichiers) : le meme site sur le projet
      # `sprinter-game` (sprinter-game.pages.dev). Tant que le domaine n'y a pas bascule,
      # GitHub Pages reste la version servie aux joueurs : un echec ici ne bloque pas sa
      # publication.
      - name: Publier sur Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name sprinter-game --branch main --commit-dirty=true

      # Prevenir le depot des tests qu'il y a du nouveau : il reconstruit tout de suite au
      # lieu d'attendre sa verification des demi-heures. Il faut pour cela un jeton
      # (secret SPRINTER_TEST_TOKEN, droit « Contents: write » sur benbezi-dev/sprinter) ;
      # sans lui, l'etape ne fait rien.
      - name: Prevenir le depot des tests
        continue-on-error: true
        env:
          JETON: ${{ secrets.SPRINTER_TEST_TOKEN }}
        run: |
          [ -n "$JETON" ] || { echo "pas de SPRINTER_TEST_TOKEN : le depot des tests passera de lui-meme"; exit 0; }
          curl -fsS -X POST -H "Authorization: Bearer $JETON" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/benbezi-dev/sprinter/dispatches \
            -d '{"event_type":"deployer-test"}'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
