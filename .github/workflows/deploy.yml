name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      # Le jeu, tel que tout le monde le voit. Il est servi a la racine de
      # sprinter-game.com et non plus dans un sous-dossier au nom du depot :
      # le chemin de base se reduit donc a « / ».
      - name: Construire la production
        run: npm run build
        env:
          BASE_PATH: /

      # CE QUE LE CANAL DE TEST GARDE POUR LUI. public/ est copie tel quel dans
      # chaque build : les portraits et la musique des evenements pas encore
      # ouverts seraient servis a la racine du site, lisibles par quiconque
      # devine l'adresse. On les retire de la production ; la version de test,
      # construite a part, les garde sous /test/vedettes/.
      # Les defis de Meba-Mickael Zeze et d'Aurel Manga s'ouvrent tout seuls
      # le samedi 3 octobre 2026 a 21 h 30 (canal.ts, vite.config.ts) : leurs
      # fichiers (meba-*, manga-*, defi-aurel.mp3) doivent donc deja etre en
      # ligne. Aucun evenement n'est retire aujourd'hui ; un prochain qui
      # attendrait sa date se retirerait ici, comme Aurel jusqu'au 03/10.
      #
      # LA RUELLE DE LA NUIT DU MOLOSSE RESTE EN PRODUCTION (16/10). Elle en
      # etait retiree ici tant que le mode ne vivait que sur /test ; l'edition
      # s'ouvre au public (src/game/halloween-ouverture.js), et cette ligne
      # aurait fait courir les treize nuits sur des paves vides. Les images ne
      # se telechargent qu'a la demande, nuit par nuit (src/game/chargement.ts) :
      # un joueur qui n'ouvre pas le mode n'en recoit aucune.

      # La version de test, dans un sous-dossier du meme site. Un seul
      # deploiement sert les deux : pas de second depot a tenir a jour, et la
      # version de test recoit chaque changement au meme moment que l'autre.
      #
      # VITE_CANAL=test est ce qui ouvre tout — et, en production, ce qui fait
      # disparaitre du build tout ce qui n'est pas ouvert.
      - name: Construire la version de test
        run: npx vite build --outDir dist-test
        env:
          BASE_PATH: /test/
          VITE_CANAL: test

      # Le manifeste dit a iOS et Android quelle application on installe. Sans
      # cette reecriture, la version de test revendiquerait l'identite et le
      # perimetre du vrai jeu : installer l'une remplacerait l'autre.
      - name: Distinguer la version de test a l'installation
        run: |
          node -e '
            const f = "dist-test/manifest.webmanifest";
            const m = JSON.parse(require("fs").readFileSync(f, "utf8"));
            const base = "/test/";
            m.name = "Sprinter — test";
            m.short_name = "Sprinter test";
            m.id = base;
            m.scope = base;
            m.start_url = ".";
            require("fs").writeFileSync(f, JSON.stringify(m, null, 2));
          '
          mv dist-test dist/test

      # LA BRANCHE DE TEST 3D, sous /test3d/ (23/10, l'auteur : « met le jeu en ligne mais
      # pas pour les joueurs, uniquement sur une branche test 3D »). Elle est construite
      # depuis la branche test-ferme/course-3d, en canal de test : la meme porte a code
      # que /test/, aucun joueur n'y entre. La production et /test/ viennent toujours de
      # main (ce depot-ci) ; la branche n'a pas de workflow a elle : une poussee sur elle
      # ne publie rien, on relance ce deploiement (gh workflow run deploy.yml --ref main).
      #
      # Le JEU COMPLET (« je veux le jeu complet, en test », 23/10) : rien n'est retire ici.
      # C'est GitHub Pages, plafonne vers 1 Go, qui en recoit plus bas une copie allegee ;
      # Cloudflare Pages, lui, recoit tout. Si la branche n'existe plus, l'etape ne fait rien.
      - name: Construire la branche de test 3D
        run: |
          git fetch --depth 1 origin test-ferme/course-3d || { echo "pas de branche test 3D"; exit 0; }
          git worktree add ../course-3d FETCH_HEAD
          cd ../course-3d
          npm install
          npx vite build --outDir dist-test3d
          node -e '
            const f = "dist-test3d/manifest.webmanifest";
            const m = JSON.parse(require("fs").readFileSync(f, "utf8"));
            const base = "/test3d/";
            m.name = "Sprinter — test 3D";
            m.short_name = "Sprinter 3D";
            m.id = base;
            m.scope = base;
            m.start_url = ".";
            require("fs").writeFileSync(f, JSON.stringify(m, null, 2));
          '
          mv dist-test3d "$GITHUB_WORKSPACE/dist/test3d"
        env:
          BASE_PATH: /test3d/
          VITE_CANAL: test

      # CLOUDFLARE PAGES (23/10, « heberger le site sur Cloudflare Pages » — pas de plafond
      # de taille, 25 Mo par fichier, 20 000 fichiers) : le meme site, complet, sur le
      # projet `sprinter-game` (sprinter-game.pages.dev). Tant que le domaine n'y a pas
      # bascule, GitHub Pages reste la version servie aux joueurs : un echec ici ne bloque
      # pas sa publication.
      - name: Publier sur Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name sprinter-game --branch main --commit-dirty=true

      # LA COPIE POUR GITHUB PAGES, sous son plafond d'1 Go : la version 3D y laisse les
      # videos anglaises du molosse et les images 2D de la ruelle (~160 Mo).
      - name: Alleger la version 3D pour GitHub Pages
        run: rm -rf dist/test3d/modeles/stades-ultra dist/test3d/decors-ultra/halloween-* dist/test3d/halloween/*-en.mp4 dist/test3d/halloween/*-en.jpg dist/test3d/halloween/*-en.webp

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
