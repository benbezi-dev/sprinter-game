apply plugin: 'com.android.application'

/**
 * La signature de publication.
 *
 * Play n'accepte qu'un paquet signe, et la cle qui le signe est ce qui prouve
 * qu'une mise a jour vient bien de nous. Elle ne peut donc pas vivre dans le
 * depot : les secrets sont lus depuis `android/keystore.properties`, ignore par
 * git, et le trousseau lui-meme est range hors du projet.
 *
 * Sans ce fichier, rien ne casse — le build de debogage continue de tourner et
 * `bundleRelease` produit simplement un paquet non signe. C'est voulu : un
 * clone frais doit compiler sans avoir a fabriquer une cle d'abord.
 */
def fichierCles = rootProject.file('keystore.properties')
def cles = new Properties()
if (fichierCles.exists()) {
    fichierCles.withInputStream { cles.load(it) }
}

// On ne se contente pas de l'existence du fichier : un `keystore.properties`
// a moitie rempli — le cas normal juste apres l'avoir copie du modele — ferait
// echouer `bundleRelease` sur une erreur de mot de passe illisible. On verifie
// donc que le trousseau est vraiment la et que les quatre champs sont
// renseignes, et on dit lequel manque.
def manques = []
if (fichierCles.exists()) {
    ['storeFile', 'keyAlias', 'storePassword', 'keyPassword'].each {
        if (!cles[it]) manques << it
    }
    if (cles['storeFile'] && !file(cles['storeFile']).exists()) {
        manques << "trousseau introuvable au chemin indique (${cles['storeFile']})"
    }
}
def signaturePrete = fichierCles.exists() && manques.isEmpty()

/*
 * Un `keystore.properties` present mais casse ARRETE la release.
 *
 * Ce n'etait pas le cas, et cela a coute une livraison : le chemin declare
 * pointait sur une autre machine, le build ne s'est pas arrete, il a produit
 * un paquet NON SIGNE et s'est contente d'un `logger.warn` que les centaines
 * de lignes de Gradle noient completement. On ne l'apprend alors qu'au refus
 * de Play, ou jamais.
 *
 * Le refus est pose sur le graphe des taches, pas a la configuration : un
 * `assembleDebug` ou un `cap sync` continuent de tourner sans trousseau, et
 * l'absence complete du fichier reste permise — un clone frais et la CI
 * doivent compiler sans avoir a fabriquer une cle. C'est le fichier a moitie
 * rempli, et lui seul, qui est traite comme une erreur.
 */
gradle.taskGraph.whenReady { graphe ->
    if (fichierCles.exists() && !signaturePrete &&
            graphe.allTasks.any { it.name.toLowerCase().contains('release') }) {
        throw new GradleException(
            "Sprinter : android/keystore.properties est present mais inutilisable — " +
            manques.join(', ') + ".\n" +
            "Un paquet de publication non signe est refuse par Play : on s'arrete ici " +
            "plutot que d'en fabriquer un. Completer le fichier, ou le retirer pour " +
            "produire volontairement un paquet non signe.")
    }
}

android {
    namespace = "dev.benbezi.sprinter"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.benbezi.sprinter"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Renseignes seulement si le fichier existe : y toucher sans lui
            // ferait echouer la configuration du projet, y compris pour un
            // simple build de debogage.
            if (signaturePrete) {
                storeFile file(cles['storeFile'])
                storePassword cles['storePassword']
                keyAlias cles['keyAlias']
                keyPassword cles['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signaturePrete) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
