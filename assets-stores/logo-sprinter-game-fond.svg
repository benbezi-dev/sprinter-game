      <path d="M233.9 123.2 L259.9 89.2 L220.1 58.8 L194.1 92.8 Z"/>
      <path d="M278.2 68.2 L258.2 88.2 L229.8 88.2 L209.8 68.2 L209.8 39.8 L229.8 19.8 L258.2 19.8 L278.2 39.8 Z"/>
      </g>
    </mask>
    <mask id="decoupe-coureur">
      <rect x="-38" y="0" width="1362" height="540" fill="#fff"/>
      <g fill="#000" transform="translate(215 150) scale(1.5) skewX(-11)">
        
