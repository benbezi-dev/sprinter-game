<svg xmlns="http://www.w3.org/2000/svg" viewBox="-38 0 1362 540" width="1362" height="540" role="img" aria-label="SPRINTER-GAME">
  <title>SPRINTER-GAME</title>
  <defs>
    <!-- Deux degrades pour un seul or : le mot et le coureur n'ont pas le meme
         repere, un degrade en unites d'objet se recalerait sur chaque lettre. -->
    <linearGradient id="or-mot" gradientUnits="userSpaceOnUse" x1="0" y1="-6" x2="0" y2="106">
      <stop offset="0%" stop-color="#FFE9A3"/>
      <stop offset="55%" stop-color="#F8CD4A"/>
      <stop offset="100%" stop-color="#E0A92C"/>
    </linearGradient>
    <linearGradient id="or-coureur" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="310">
      <stop offset="0%" stop-color="#FFE9A3"/>
      <stop offset="55%" stop-color="#F8CD4A"/>
      <stop offset="100%" stop-color="#E0A92C"/>
    </linearGradient>
    
    <clipPath id="cadre">
      <rect x="-38" y="0" width="1362" height="540" rx="28"/>
    </clipPath>
