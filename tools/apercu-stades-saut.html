<!doctype html>
<meta charset="utf-8">
<title>Jumper — les stades des etapes</title>
<style>
  body { margin: 0; background: #0b0d14; color: #cfd3e0; font: 12px ui-monospace, Menlo, monospace; }
  #etat { padding: 6px 10px; }
  .grille { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 6px 6px; }
  figure { margin: 0; }
  figcaption { padding: 3px 2px; color: #8d93a8; }
  canvas { width: 100%; display: block; border-radius: 4px; }
</style>
<!--
  LES SIX ETAPES DE JUMPER, CHACUNE DANS SON STADE (sauts-stades.js).

  Comme la galerie des stades, la page fait tourner le moteur hors de
  l'application : elle arme un concours de saut en longueur a chaque etape,
  appelle le sauteur sur sa marque, laisse la camera se poser, et garde une
  image. C'est l'ecran que le joueur voit quand vient son tour.

  npm run dev, puis /tools/apercu-stades-saut.html
-->
<div id="etat">...</div>
<div class="grille" id="grille"></div>
<script type="module">
  import { SprinterApp, updateLogic } from '/src/game/engine.ts';
  import { armerConcoursSaut, appelerSauteur } from '/src/game/longueur-course.js';
  import { appliquerAmbiance } from '/src/game/sauts-stades.js';

  const { G, THEMES, LEVELS, drawWorld, drawAthletes } = SprinterApp;
  const cv = document.createElement('canvas');
  cv.width = 844 * 2; cv.height = 390 * 2;
  const ctx = cv.getContext('2d');
  G.cv = cv; G.dpr = 2; G.VW = cv.width; G.VH = cv.height; G.portrait = false;
  SprinterApp.load();
  const etat = document.getElementById('etat');
  const grille = document.getElementById('grille');
  const NOMS = ['Competition scolaire', 'Niveau regional', 'Niveau national',
                'Championnat du monde', '0.Games', 'Inter galactique'];

  for (let etape = 0; etape < 6; etape++) {
    armerConcoursSaut(etape, 'longueur');
    appelerSauteur({ vent: 0, lignes: [] });
    const th = () => THEMES[LEVELS[G.levelIdx].theme];
    // une image pour que le stade demande ses decors, puis le temps de les recevoir
    drawWorld(ctx, th());
    await new Promise(r => setTimeout(r, 1800));
    for (let i = 0; i < 45; i++) updateLogic(1 / 30);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, G.VW, G.VH);
    drawWorld(ctx, th());
    drawAthletes(ctx);
    // la lumiere de l'heure, comme GameCanvas la pose
    appliquerAmbiance(ctx, G.VW, G.VH, G.ambianceSaut);
    const fig = document.createElement('figure');
    const img = document.createElement('canvas');
    img.width = cv.width; img.height = cv.height;
    img.getContext('2d').drawImage(cv, 0, 0);
    const cap = document.createElement('figcaption');
    cap.textContent = `etape ${etape + 1} — ${NOMS[etape]} — ${LEVELS[G.levelIdx].name}${G.ambianceSaut ? ' — ' + G.ambianceSaut : ''}`;
    fig.append(img, cap);
    grille.append(fig);
    etat.textContent = `etape ${etape + 1} faite`;
  }
  etat.textContent = 'fini : six etapes';
</script>
