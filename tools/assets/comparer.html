<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Comparer deux GLB</title>
<style>body{margin:0;background:#202428;color:#ddd;font:14px sans-serif}#v{display:flex}canvas{width:50vw;height:90vh}p{margin:4px 8px}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><p id="t">?a=chemin.glb&b=chemin.glb (chemins depuis la racine du dépôt) · &angle=0..360</p><div id="v"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const Q = new URLSearchParams(location.search);
const angle = (+(Q.get('angle') || 30)) * Math.PI / 180;
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
async function vue(url) {
  const c = document.createElement('canvas'); document.getElementById('v').appendChild(c);
  const r = new THREE.WebGLRenderer({ canvas: c, antialias: true, preserveDrawingBuffer: true });
  r.setSize(c.clientWidth, c.clientHeight, false);
  r.toneMapping = THREE.ACESFilmicToneMapping;
  const s = new THREE.Scene(); s.background = new THREE.Color(0x8a9aa8);
  s.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.2));
  const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(3, 5, 4); s.add(d);
  const g = await loader.loadAsync(url);
  let tris = 0; g.scene.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  s.add(g.scene);
  const b = new THREE.Box3().setFromObject(g.scene), ctr = b.getCenter(new THREE.Vector3()), t = b.getSize(new THREE.Vector3()).length();
  const cam = new THREE.PerspectiveCamera(35, c.clientWidth / c.clientHeight, t / 100, t * 10);
  cam.position.set(ctr.x + Math.sin(angle) * t * 1.3, ctr.y + t * 0.35, ctr.z + Math.cos(angle) * t * 1.3); cam.lookAt(ctr);
  r.render(s, cam);
  return url.split('/').pop() + ' : ' + Math.round(tris).toLocaleString('fr') + ' triangles';
}
const a = await vue(Q.get('a')), bb = await vue(Q.get('b'));
document.getElementById('t').textContent = 'A ' + a + ' · B ' + bb;
document.title = 'pret';
</script></body></html>
