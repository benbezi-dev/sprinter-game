<!doctype html>
<meta charset="utf-8">
<title>Sprinter — bandeaux de la video</title>
<style>body{margin:0;background:#0b0d14;color:#cfd3e0;font:13px ui-monospace,Menlo,monospace;padding:10px}</style>
<div id="etat">...</div>
<script type="module">
  // ffmpeg n'a pas ete compile avec freetype sur cette machine : il ne sait
  // pas ecrire une ligne de texte sur une image. Le navigateur, lui, sait
  // faire cela depuis toujours. On fabrique donc les bandeaux ici, en PNG
  // transparents, et ffmpeg n'a plus qu'a les poser par-dessus.
  const COLLECTEUR = 'http://localhost:5299';
  // [bandeau du bas, etiquette du haut]
  // [bandeau du bas, etiquette du haut]
  const L = [
    ['La piste continue derrière le départ : le couloir 1 n’est plus dans le vide', '200 M'],
    ['Des gradins en marches, des sièges, un public assis face à la piste', 'SCOLAIRE — PEU DE MONDE'],
    ['Des gradins en marches, des sièges, un public assis face à la piste', 'CHAMPIONNAT DU MONDE — COMPLET'],
    ['Couleurs plus franches, plus de taches sur la piste ni la pelouse', 'STADE DU DANUBE'],
    ['Couleurs plus franches, plus de taches sur la piste ni la pelouse', 'RIVIERA'],
    ['Dans le virage, le public de la tribune côté caméra, vu de dos', 'INTER GALACTIQUE'],
  ];
  const cv = document.createElement('canvas');
  cv.width = 1280; cv.height = 720;
  const c = cv.getContext('2d');
  const envois = [];
  L.forEach(([titre, cotes], i) => {
    c.clearRect(0, 0, 1280, 720);
    c.font = '600 30px -apple-system, Helvetica, Arial, sans-serif';
    const w = c.measureText(titre).width;
    c.fillStyle = 'rgba(11,13,20,0.78)';
    c.beginPath(); c.roundRect(32, 624, w + 44, 58, 10); c.fill();
    c.fillStyle = '#eef0f8';
    c.textBaseline = 'middle';
    c.fillText(titre, 54, 654);
    if (cotes) {
      c.font = '700 26px -apple-system, Helvetica, Arial, sans-serif';
      const tw = c.measureText(cotes).width;
      c.fillStyle = 'rgba(11,13,20,0.8)';
      c.beginPath(); c.roundRect(26, 26, tw + 30, 48, 8); c.fill();
      c.fillStyle = '#f8cd4a'; c.fillText(cotes, 41, 50);
    }
    envois.push(fetch(COLLECTEUR + '/f/' + i, { method: 'POST', body: cv.toDataURL('image/png') }));
  });
  await Promise.all(envois);
  document.getElementById('etat').textContent = 'bandeaux envoyes : ' + L.length;
</script>
