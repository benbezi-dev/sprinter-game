<!doctype html>
<meta charset="utf-8">
<title>Sprinter — le decor, ordinaire contre ULTRA</title>
<style>body{margin:0;background:#0b0d14;color:#cfd3e0;font:13px ui-monospace,Menlo,monospace}#etat{padding:8px 12px}</style>
<div id="etat">...</div>
<canvas id="cv"></canvas>
<script type="module">
  // LA MEME IMAGE, DEUX FOIS, A TROIS PIXELS PAR POINT : une avec les series
  // ULTRA (pieces Blender, Champ-de-Mars, public : fabriquer.py, champ-de-
  // mars.py et tribune.py --ultra), une avec les series ordinaires. Meme
  // course, meme instant, meme cadre : seules les images rendues changent.
  // Envoie les deux au collecteur (tools/collecteur.mjs) : 000000 l'ULTRA,
  // 000001 l'ordinaire.
  //
  //   ?stade=4&epreuve=200&instant=230&w=390&h=844&vers=http://localhost:5303
  import { SprinterApp, updateLogic, padPress } from '/src/game/engine.ts';

  const P = new URLSearchParams(location.search);
  const VERS = P.get('vers') || 'http://localhost:5299';
  const DPR = 3, LW = +(P.get('w') || 390), LH = +(P.get('h') || 844);
  const cv = document.getElementById('cv');
  cv.width = LW * DPR; cv.height = LH * DPR;
  const ctx = cv.getContext('2d');
  const etat = document.getElementById('etat');
  const { G, THEMES, LEVELS, drawWorld, drawAthletes } = SprinterApp;
  G.onRaceRecorded = () => {};
  G.cv = cv; G.dpr = DPR; G.VW = LW; G.VH = LH; G.portrait = LH > LW;
  SprinterApp.load();
  // ?stade=5:nuit : un index de LEVELS, avec un theme force apres ':'
  const [idxS, themeForce] = (P.get('stade') || '4').split(':');
  if (themeForce) { LEVELS[+idxS].theme = themeForce; LEVELS[+idxS].stades = null; }
  SprinterApp.startOneShot([P.get('epreuve') || '200'], { levelIdx: +idxS });
  const th = THEMES[LEVELS[G.levelIdx].theme];
  const pause = (ms) => new Promise(r => setTimeout(r, ms));

  let cote = 0;
  for (let i = 0; i < +(P.get('instant') || 230); i++) {
    if (G.state === 'race' && i % 2 === 0) padPress((cote++ % 2) ? 'right' : 'left');
    updateLogic(1 / 30);
  }
  const image = () => {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawWorld(ctx, th);
    drawAthletes(ctx);
  };
  // Le temps que l'atlas arrive et que le public se compose, a l'arret.
  async function vue(n) {
    for (let k = 0; k < 20; k++) { image(); await pause(150); }
    for (let k = 0; k < 200; k++) { image(); await pause(0); }
    image();
    await fetch(VERS + '/f/' + String(n).padStart(6, '0'), { method: 'POST', body: cv.toDataURL('image/png') });
  }
  etat.textContent = 'ultra';
  await vue(0);
  globalThis.SprinterTribuneManifesteUltra = {};
  globalThis.SprinterDecorsManifesteUltra = { pxParM: 192, stades: {} };
  globalThis.ChampDeMarsManifesteUltra = { pieces: {} };
  etat.textContent = 'ordinaire';
  await vue(1);
  etat.textContent = 'fini';
</script>
