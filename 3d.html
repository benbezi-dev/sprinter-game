<!DOCTYPE html>
<!-- SPRINTER — maquette 3D.

     Cette page n'entre dans aucun build : `vite build` ne construit que
     `index.html`. Elle n'existe que sur le serveur de developpement, et
     three.js reste une dependance de developpement. Le jeu publie ne change
     pas d'un octet.

     Ouvrir : npm run dev, puis http://localhost:5173/3d.html -->
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sprinter — maquette 3D</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
      body { font: 500 14px/1.3 ui-sans-serif, system-ui, sans-serif; color: #eef1f6; }
      #app, #app canvas { position: fixed; inset: 0; display: block; }
      .hud { position: fixed; pointer-events: none; z-index: 5;
             text-shadow: 0 2px 10px rgba(0,0,0,.75); }
      #haut { top: 0; left: 0; right: 0; display: flex; align-items: flex-start;
              justify-content: space-between; padding: 18px 22px; gap: 16px; }
      #lieu { font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
              opacity: .75; }
      #chrono { font-variant-numeric: tabular-nums; font-size: 54px; font-weight: 800;
                line-height: .95; color: #f8cd4a; letter-spacing: -.02em; }
      .bloc { text-align: right; }
      .etiq { font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
              opacity: .6; }
      .val { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; }
      #bas { left: 0; right: 0; bottom: 0; padding: 16px 22px;
             display: flex; justify-content: space-between; align-items: flex-end; }
      #aide { font-size: 12px; opacity: .72; line-height: 1.7; }
      kbd { display: inline-block; min-width: 20px; text-align: center;
            padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.14);
            border: 1px solid rgba(255,255,255,.2); font: 600 11px/1.5 inherit; }
      #vue { font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
             opacity: .65; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="hud" id="haut">
      <div>
        <div id="lieu">—</div>
        <div id="chrono">3</div>
      </div>
      <div style="display:flex; gap:26px">
        <div class="bloc"><div class="etiq">Vitesse</div><div class="val" id="vitesse">0</div></div>
        <div class="bloc"><div class="etiq">Distance</div><div class="val" id="dist">0 m</div></div>
        <div class="bloc"><div class="etiq">Rang</div><div class="val" id="rang">—</div></div>
      </div>
    </div>

    <div class="hud" id="bas">
      <div id="aide">
        <kbd>←</kbd> <kbd>→</kbd> alterner pour courir &nbsp;·&nbsp;
        <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> camera &nbsp;·&nbsp;
        <kbd>N</kbd> jour / nuit &nbsp;·&nbsp; <kbd>R</kbd> rejouer
      </div>
      <div id="vue">poursuite</div>
    </div>

    <script type="module" src="/src/3d/main.js"></script>
  </body>
</html>
