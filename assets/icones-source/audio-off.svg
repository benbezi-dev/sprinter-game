<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Son coupe. L'ancienne version etait le meme haut-parleur sans ses
       ondes : rien ne disait « coupe », seule l'opacite du bouton le
       laissait deviner. La croix le dit. -->
  <defs>
    <linearGradient id="creme" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C3CEE0"/>
    </linearGradient>
  </defs>
  <path d="M12 25 H21 L31 15.5 V48.5 L21 39 H12 Z" fill="url(#creme)"
        stroke="url(#creme)" stroke-width="3.4" stroke-linejoin="round"/>
  <g stroke="url(#creme)" stroke-width="5.5" stroke-linecap="round">
    <path d="M39 25 L51 37"/>
    <path d="M51 25 L39 37"/>
  </g>
</svg>
