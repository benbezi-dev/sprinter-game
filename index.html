<!DOCTYPE html>
<!-- lang="fr" et translate="no" : la page etait declaree en anglais alors
     que toute l'interface est en francais, donc les navigateurs mobiles
     proposaient (ou appliquaient) une traduction. Or un moteur de
     traduction remplace directement les noeuds de texte du DOM, ce que
     React ne supporte pas : au premier changement d'ecran il tente de
     retirer un noeud qui n'existe plus et plante. Le jeu gere deja sa
     propre traduction FR/EN, la traduction navigateur n'a donc rien a
     faire ici. L'attribut lang est resynchronise au changement de langue. -->
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <title>Sprinter</title>
    <!-- CE QUE MONTRE LE LIEN QUAND ON LE COLLE AILLEURS.
         Ces lignes portaient encore le texte d'exemple de l'outil qui a servi
         a demarrer le projet — « built on Replit. Update this description » —
         et c'est ce que X, Discord, WhatsApp et iMessage affichaient sous
         chaque lien partage, defis compris. L'apercu est la seule chose que
         voit quelqu'un qui n'a jamais entendu parler du jeu : il dit
         maintenant ce que le jeu est, en francais, comme le reste de la page.

         L'image est designee par une ADRESSE ABSOLUE. Les lecteurs d'apercu
         ne resolvent pas un chemin relatif : une image en /icon-512.png etait
         ignoree par la moitie d'entre eux, et l'autre moitie affichait une
         icone carree la ou un rectangle 1200x630 est attendu. Elle se
         refabrique par `node tools/carte-og.mjs`, et ne porte aucun chiffre :
         servie pendant des mois, un chrono y serait faux la semaine d'apres. -->
    <meta name="description" content="Un 100 mètres en deux touches. Pose ton chrono, entre au TOP 500 mondial, défie n'importe qui avec un code." />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="Sprinter" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sprinter-game.com/" />
    <meta property="og:title" content="Sprinter — tu vaux quoi sur 100 mètres ?" />
    <meta property="og:description" content="Un 100 mètres en deux touches. Pose ton chrono, entre au TOP 500 mondial, défie n'importe qui avec un code." />
    <meta property="og:image" content="https://sprinter-game.com/og-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Huit coureurs sur la piste d'un stade de nuit, dans le jeu Sprinter." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sprinter — tu vaux quoi sur 100 mètres ?" />
    <meta name="twitter:description" content="Un 100 mètres en deux touches. Pose ton chrono, entre au TOP 500 mondial, défie n'importe qui avec un code." />
    <meta name="twitter:image" content="https://sprinter-game.com/og-1200x630.png" />
    <meta name="theme-color" content="#0a0f1c" />
    <!-- Avant iOS 16.4, Safari ignorait le champ `display` du manifeste : seule
         cette balise faisait ouvrir l'application en plein ecran depuis
         l'ecran d'accueil. Sans effet sur les versions recentes, qui lisent le
         manifeste — mais les anciennes rouvraient l'application dans Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sprinter" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <!-- Chemin relatif a la base : le site est publie sous un
         sous-repertoire, et un href absolu en /... tombait sur un 404. Sans
         manifeste atteignable, Chrome ne juge pas l'application installable
         du tout — donc pas d'installation, et pas de capture des liens. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
