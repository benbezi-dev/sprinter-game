<!DOCTYPE html>
<!-- lang="fr" et translate="no" : la page etait declaree en anglais alors
     que toute l'interface est en francais, donc les navigateurs mobiles
     proposaient (ou appliquaient) une traduction. Or un moteur de
     traduction remplace directement les noeuds de texte du DOM, ce que
     React ne supporte pas : au premier changement d'ecran il tente de
     retirer un noeud qui n'existe plus et plante. Le jeu gere deja sa
     propre traduction FR/EN, la traduction navigateur n'a donc rien a
     faire ici. L'attribut lang est resynchronise au changement de langue. -->
<html lang="fr" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <title>Sprinter</title>
    <meta name="description" content="Jeu d'athlétisme arcade : 100 m, 200 m, 400 m. Six étapes, un seul chrono à battre, et un classement mondial. Gratuit, sans inscription, dans le navigateur." />
    <meta name="robots" content="index, follow" />
    <!-- Un lien partage dans une conversation vaut par sa vignette : sans elle
         il ne ressemble a rien et personne ne l'ouvre. Ces balises etaient
         restees sur le gabarit de l'outil qui a genere le projet — chaque lien
         du jeu annoncait donc « built on Replit. Update this description ».
         Les adresses sont absolues : un chemin relatif ne se resout pas dans
         un aspirateur de vignettes, qui ne charge pas la page. -->
    <meta property="og:site_name" content="Sprinter" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sprinter-game.com/" />
    <meta property="og:title" content="Sprinter — six étapes, un seul chrono à battre" />
    <meta property="og:description" content="Jeu d'athlétisme arcade : 100 m, 200 m, 400 m et un classement mondial. Gratuit, sans inscription." />
    <meta property="og:image" content="https://sprinter-game.com/partage.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SPRINTER — six étapes, un seul chrono à battre. 100 m, 200 m, 400 m." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sprinter — six étapes, un seul chrono à battre" />
    <meta name="twitter:description" content="Jeu d'athlétisme arcade : 100 m, 200 m, 400 m et un classement mondial. Gratuit, sans inscription." />
    <meta name="twitter:image" content="https://sprinter-game.com/partage.png" />
    <meta name="theme-color" content="#0a0f1c" />
    <!-- Avant iOS 16.4, Safari ignorait le champ `display` du manifeste : seule
         cette balise faisait ouvrir l'application en plein ecran depuis
         l'ecran d'accueil. Sans effet sur les versions recentes, qui lisent le
         manifeste — mais les anciennes rouvraient l'application dans Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sprinter" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <!-- Chemin relatif a la base : le site est publie sous un
         sous-repertoire, et un href absolu en /... tombait sur un 404. Sans
         manifeste atteignable, Chrome ne juge pas l'application installable
         du tout — donc pas d'installation, et pas de capture des liens. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Les trois familles que le jeu utilise vraiment (voir --font-display,
         --font-sans et --font-mono dans src/index.css). Elles arrivaient par un
         @import en tete de la feuille : le navigateur ne les decouvrait donc
         qu'apres avoir telecharge et lu tout le CSS, deux allers-retours en
         file au lieu d'un. Ici elles partent en meme temps que lui.
         Le lien precedent chargeait Inter, qu'aucune regle n'emploie. -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
