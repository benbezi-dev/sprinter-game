name = "sprinter-leaderboard"
main = "src/index.js"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "sprinter-leaderboard"
database_id = "67256277-9486-4e46-96e7-337bf789a327"

# La base du canal de test. Elle existe pour une raison simple : la version de
# test ouvre tout, y compris les duels, et les parties qu'on y joue n'ont rien
# a faire dans le classement reel. Deux bases plutot qu'une colonne « canal »
# sur chaque table, parce qu'il suffirait d'oublier un seul filtre quelque part
# pour qu'une partie de test remonte au classement — et on ne s'en apercevrait
# qu'apres.
[[d1_databases]]
binding = "DB_TEST"
database_name = "sprinter-leaderboard-test"
database_id = "94531930-4cf2-41ea-9f91-7acbc82599e5"

# Une salle de course en direct par partie. Un Durable Object est le seul
# moyen d'avoir un point de rendez-vous unique et cohérent : deux joueurs qui
# se défient doivent tomber sur le MÊME objet, quel que soit le datacentre qui
# les accueille, et partager la même horloge de départ.
[[durable_objects.bindings]]
name = "SALLES"
class_name = "SalleDirecte"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SalleDirecte"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SalleRelais"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SalleConfrontation"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Boite"]

# Une salle de relais par equipe : quatre joueurs et un temoin partagent le
# meme objet, comme les deux joueurs d'un duel partagent le leur.
[[durable_objects.bindings]]
name = "SALLES_RELAIS"
class_name = "SalleRelais"

# Une confrontation de deux a huit equipes de relais. Distincte de la salle
# d'une equipe seule : elle partage un seul coup de pistolet entre toutes, et
# rend un classement a l'arrivee. Les regles du temoin, elles, sont les memes —
# elles vivent dans relais-course.js et ne sont recopiees nulle part.
[[durable_objects.bindings]]
name = "CONFRONTATIONS"
class_name = "SalleConfrontation"

# La boite d'un joueur : une par appareil, et une WebSocket ouverte pendant
# qu'il joue. Elle ne porte que des coups de sonnette — defi recu, duel
# tranche, mot depose — et le jeu va chercher le contenu par les routes
# ordinaires. C'est ce qui remplace un sondage de dix a vingt secondes par une
# nouvelle qui arrive dans la seconde, a cote comme a l'autre bout du monde.
[[durable_objects.bindings]]
name = "BOITES"
class_name = "Boite"
