name = "sprinter-leaderboard"
main = "src/index.js"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "sprinter-leaderboard"
database_id = "67256277-9486-4e46-96e7-337bf789a327"

# La base du canal de test. Elle existe pour une raison simple : la version de
# test ouvre tout, y compris les duels, et les parties qu'on y joue n'ont rien
# a faire dans le classement reel. Deux bases plutot qu'une colonne « canal »
# sur chaque table, parce qu'il suffirait d'oublier un seul filtre quelque part
# pour qu'une partie de test remonte au classement — et on ne s'en apercevrait
# qu'apres.
[[d1_databases]]
binding = "DB_TEST"
database_name = "sprinter-leaderboard-test"
database_id = "94531930-4cf2-41ea-9f91-7acbc82599e5"

# Une salle de course en direct par partie. Un Durable Object est le seul
# moyen d'avoir un point de rendez-vous unique et cohérent : deux joueurs qui
# se défient doivent tomber sur le MÊME objet, quel que soit le datacentre qui
# les accueille, et partager la même horloge de départ.
[[durable_objects.bindings]]
name = "SALLES"
class_name = "SalleDirecte"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SalleDirecte"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SalleRelais"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SalleConfrontation"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Boite"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["SalleChampionnat"]

# Une salle de relais par equipe : quatre joueurs et un temoin partagent le
# meme objet, comme les deux joueurs d'un duel partagent le leur.
[[durable_objects.bindings]]
name = "SALLES_RELAIS"
class_name = "SalleRelais"

# Une confrontation de deux a huit equipes de relais. Distincte de la salle
# d'une equipe seule : elle partage un seul coup de pistolet entre toutes, et
# rend un classement a l'arrivee. Les regles du temoin, elles, sont les memes —
# elles vivent dans relais-course.js et ne sont recopiees nulle part.
[[durable_objects.bindings]]
name = "CONFRONTATIONS"
class_name = "SalleConfrontation"

# La boite d'un joueur : une par appareil, et une WebSocket ouverte pendant
# qu'il joue. Elle ne porte que des coups de sonnette — defi recu, duel
# tranche, mot depose — et le jeu va chercher le contenu par les routes
# ordinaires. C'est ce qui remplace un sondage de dix a vingt secondes par une
# nouvelle qui arrive dans la seconde, a cote comme a l'autre bout du monde.
[[durable_objects.bindings]]
name = "BOITES"
class_name = "Boite"

# La course en direct d'une serie de championnat : une salle par course, avec
# sa grille, son heure et son faux depart. Voir salle-championnat.js.
[[durable_objects.bindings]]
name = "SALLES_CHAMP"
class_name = "SalleChampionnat"

# L'Objectif du jour part a midi et a dix-neuf heures — a l'heure du joueur,
# pas a celle du serveur. Un envoi unique a 12:00 UTC tomberait a 4 h du matin
# en Californie et a 21 h a Tokyo : l'inverse des heures de forte affluence
# qu'on vise.
#
# Le cron passe donc toutes les cinq minutes et ne sert que ceux dont l'heure
# locale vient de tomber sur leur creneau, decalage personnel compris. Tous
# les fuseaux reels sont des
# multiples de quinze minutes — l'Inde a +05:30, le Nepal +05:45, Chatham
# +12:45 — donc personne n'est manque.
# Le mode de l'Objectif du jour.
#
#   actif   il calcule, il range, il sonne.
#   essai   il calcule, il range, il JOURNALISE ce qu'il aurait envoye, et
#           n'envoie rien. C'est le mode qui permet de changer une heure de
#           creneau, un calibrage ou un texte et de voir ce que ca donne sur
#           les vrais joueurs, sans faire vibrer trois cents telephones pour
#           s'en apercevoir. Les journaux se lisent avec `wrangler tail`.
#   arrete  il ne fait rien.
#
# Se change par un deploiement, pas a chaud : un interrupteur qu'on bascule
# depuis une route est un interrupteur qu'on bascule par accident.
[vars]
OBJECTIF = "actif"

# OU PARTENT LES ALERTES DE RECUPERATION DE COMPTE.
#
# Aucune des deux n'etait posee, et le code retombait donc sur ses valeurs par
# defaut : contact@sprinter-game.com. Sept demandes deposees depuis le
# 5 septembre, sept alertes envoyees la-bas, et personne pour les lire — on a
# cherche la panne du cote de la cle Resend pendant ce temps.
#
# Il y avait en fait DEUX murs empiles, et le second ne pouvait pas se voir tant
# que le premier tenait. La cle Resend etait refusee, oui ; mais derriere elle,
# le compte etait en bac a sable — sans domaine verifie, Resend n'expedie que
# depuis onboarding@resend.dev et n'ecrit qu'a l'adresse du compte. Toute autre
# destination repartait en 403. Une cle neuve seule n'aurait donc rien repare,
# et on aurait cherche ailleurs.
#
# Le 14 septembre 2026, sprinter-game.com a ete verifie chez Resend (DKIM sur
# resend._domainkey, SPF et MX sur le sous-domaine send, region eu-west-1). Les
# deux lignes ci-dessous sont libres depuis. Le sous-domaine send tient Resend a
# l'ecart de la messagerie du domaine : les MX de la racine restent ceux de
# Google, et « Enable Receiving » chez Resend doit rester eteint — l'activer
# poserait des MX sur la racine et couperait la reception.
MAIL_DEST = "contact.pro@sprinter-game.com"
MAIL_EXPEDITEUR = "Sprinter <recuperations@sprinter-game.com>"

# POURQUOI CINQ MINUTES ET NON QUINZE. Chaque joueur recoit a quelques minutes
# pres de son heure, toujours les memes : trois cents telephones qui vibrent a
# la meme seconde, ca se voit, et un rendez-vous a 12:45:00 tous les jours a
# quelque chose de mecanique. Or le cron ne peut servir quelqu'un qu'aux
# instants ou il passe : au quart d'heure, avec des fuseaux eux-memes au quart
# d'heure, la minute locale ne prend que quatre valeurs et le seul decalage
# possible est de quinze minutes. A cinq, un decalage de cinq minutes devient
# atteignable partout.
#
# Le prix est de 288 passages par jour au lieu de 96. La quasi-totalite ne fait
# rien : une requete qui ne rend personne.
[triggers]
crons = ["*/5 * * * *"]
