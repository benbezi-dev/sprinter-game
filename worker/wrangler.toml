name = "sprinter-leaderboard"
main = "src/index.js"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "sprinter-leaderboard"
database_id = "67256277-9486-4e46-96e7-337bf789a327"

# Une salle de course en direct par partie. Un Durable Object est le seul
# moyen d'avoir un point de rendez-vous unique et cohérent : deux joueurs qui
# se défient doivent tomber sur le MÊME objet, quel que soit le datacentre qui
# les accueille, et partager la même horloge de départ.
[[durable_objects.bindings]]
name = "SALLES"
class_name = "SalleDirecte"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SalleDirecte"]
