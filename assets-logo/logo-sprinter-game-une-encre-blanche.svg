<svg xmlns="http://www.w3.org/2000/svg" viewBox="-400.0 -160.0 1185.7 238.0">
<!--
  SPRINTER-GAME — une seule encre, blanc (fond dore, photo, marquage)

  Le coureur prend la place du I : c'est le mot lui-meme qui court. Son fut
  reste dessine derriere lui, pour qu'a petite taille — ou la silhouette n'est
  plus qu'une tache — le mot se lise encore SPRINTER. Le vide autour du
  coureur est un vrai trou dans les lettres, pas un contour de la couleur du
  fond : le logo se pose donc sur n'importe quel fond.

  La vitesse tient a trois choses : le mot penche de 9 degres, des entailles
  horizontales creusent les lettres a l'arriere puis s'effacent vers l'avant
  (un degrade dans le masque), et des trainees filent derriere le S.

  Les lettres sont Outfit 900 — la police d'affichage du jeu — converties en
  courbes : aucun fichier de police n'est necessaire pour afficher ce logo.
  Outfit est sous licence SIL OFL 1.1.

  Ne pas modifier a la main sans raison : les entailles, le masque du coureur
  et la boite sont solidaires.
-->
